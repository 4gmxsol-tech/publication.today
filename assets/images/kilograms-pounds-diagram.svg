<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="One kilogram weight and its equivalent in pounds side by side">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#253d31"/>
      <stop offset="0.5" stop-color="#5c7a68"/>
      <stop offset="1" stop-color="#c98f2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g>
    <rect x="330" y="330" width="220" height="220" rx="18" fill="#ffffff" stroke="#0b3d66" stroke-width="10"/>
    <rect x="380" y="230" width="120" height="110" rx="18" fill="#ffffff" stroke="#0b3d66" stroke-width="10"/>
    <circle cx="440" cy="180" r="32" fill="none" stroke="#0b3d66" stroke-width="10"/>
    <text x="440" y="465" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#253d31" text-anchor="middle">1 kg</text>
  </g>
  <g>
    <rect x="650" y="330" width="220" height="220" rx="18" fill="#ffffff" stroke="#7a5510" stroke-width="10"/>
    <rect x="700" y="230" width="120" height="110" rx="18" fill="#ffffff" stroke="#7a5510" stroke-width="10"/>
    <circle cx="760" cy="180" r="32" fill="none" stroke="#7a5510" stroke-width="10"/>
    <text x="760" y="465" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#7a5510" text-anchor="middle">2.2 lb</text>
  </g>
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">1 kg = 2.20462 lb</text>
  <text x="440" y="640" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Kilograms</text>
  <text x="760" y="640" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Pounds</text>
  <text x="600" y="720" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">Multiply kilograms by 2.20462 to get pounds.</text>
</svg>
