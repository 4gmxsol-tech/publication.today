<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Celsius and Fahrenheit thermometers side by side">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8fd0"/>
      <stop offset="0.5" stop-color="#8a9aa8"/>
      <stop offset="1" stop-color="#f2a33c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g stroke="#0b3d66" stroke-width="10" fill="#ffffff">
    <rect x="380" y="60" width="110" height="560" rx="55"/>
    <circle cx="435" cy="660" r="75"/>
    <rect x="710" y="60" width="110" height="560" rx="55"/>
    <circle cx="765" cy="660" r="75"/>
  </g>
  <rect x="405" y="330" width="60" height="290" fill="#2f8fd0"/>
  <circle cx="435" cy="660" r="50" fill="#2f8fd0"/>
  <rect x="735" y="250" width="60" height="370" fill="#f27a2e"/>
  <circle cx="765" cy="660" r="50" fill="#f2a33c"/>
  <g stroke="#0b3d66" stroke-width="8" stroke-linecap="round">
    <line x1="380" y1="120" x2="340" y2="120"/><line x1="380" y1="180" x2="340" y2="180"/><line x1="380" y1="240" x2="340" y2="240"/><line x1="380" y1="300" x2="340" y2="300"/><line x1="380" y1="360" x2="340" y2="360"/><line x1="380" y1="420" x2="340" y2="420"/><line x1="380" y1="480" x2="340" y2="480"/><line x1="380" y1="540" x2="340" y2="540"/>
    <line x1="820" y1="120" x2="860" y2="120"/><line x1="820" y1="180" x2="860" y2="180"/><line x1="820" y1="240" x2="860" y2="240"/><line x1="820" y1="300" x2="860" y2="300"/><line x1="820" y1="360" x2="860" y2="360"/><line x1="820" y1="420" x2="860" y2="420"/><line x1="820" y1="480" x2="860" y2="480"/><line x1="820" y1="540" x2="860" y2="540"/>
  </g>
  <text x="435" y="780" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Celsius</text>
  <text x="765" y="780" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Fahrenheit</text>
</svg>
