name: Validate static site

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate advertising consent and disclosure
        run: python scripts/test_ad_consent.py
      - name: Validate article data and sitemap
        run: |
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          articles = json.loads((root / "data/articles.json").read_text(encoding="utf-8"))
          slugs = [item["slug"] for item in articles]
          assert len(slugs) == len(set(slugs)), "Duplicate article slugs"
          assert all(item.get("title") and item.get("excerpt") and item.get("category") for item in articles), "Article missing required metadata"

          sitemap = ET.parse(root / "sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in sitemap.findall("sm:url/sm:loc", ns)]
          assert len(urls) == len(set(urls)), "Duplicate sitemap URLs"
          expected_article_urls = {f"https://publication.today/articles/{slug}.html" for slug in slugs}
          missing_article_urls = expected_article_urls - set(urls)
          assert not missing_article_urls, f"Every article feed URL must be present in sitemap: {sorted(missing_article_urls)}"
          for item in articles:
              if item.get("lastmod"):
                  url = f"https://publication.today/articles/{item['slug']}.html"
                  entry = next((node for node in sitemap.findall("sm:url", ns)
                                if node.findtext("sm:loc", default="", namespaces=ns) == url), None)
                  assert entry and entry.findtext("sm:lastmod", default="", namespaces=ns) == item["lastmod"], f"Explicit lastmod mismatch for {url}"
          for url in urls:
              path = url.split("publication.today/", 1)[-1]
              path = path or "index.html"
              if not path:
                  path = "index.html"
              target = root / path
              assert target.is_file(), f"Sitemap target does not exist: {url} -> {target}"

          slug = "champions-league-fixtures-week-barcelona-psg-real-madrid-leipzig-october-2026"
          article = next((item for item in articles if item["slug"] == slug), None)
          assert article and article["category"] == "football", "Champions League preview missing from article feed"
          assert (root / "articles" / f"{slug}.html").is_file(), "Static article page is missing"
          section = (root / "section-football.html").read_text(encoding="utf-8")
          assert f"articles/{slug}.html" in section, "Football section does not link to the new preview"
          homepage = (root / "index.html").read_text(encoding="utf-8")
          assert 'data-filter="football"' in homepage and 'href="section-football.html"' in homepage, "Homepage football navigation/filter missing"

          date_slug = "days-between-dates-calculator"
          date_url = f"https://publication.today/articles/{date_slug}.html"
          date_page = root / "articles" / f"{date_slug}.html"
          assert date_url in urls and date_page.is_file(), "Date calculator must remain present in the sitemap and repository"
          technology_section = (root / "section-technology.html").read_text(encoding="utf-8")
          date_link = f"articles/{date_slug}.html"
          assert technology_section.count(f'href="{date_link}"') == 3, "Technology section must expose the date calculator card image, title and CTA links"
          assert "Free date calculator" in technology_section, "Date calculator card must retain its clear utility label"
          homepage = (root / "index.html").read_text(encoding="utf-8")
          assert homepage.count(f'href="{date_link}"') == 3, "Homepage must expose the date calculator image, title and CTA links"
          assert "FREE EVERYDAY TOOL" in homepage and "Use the date calculator" in homepage, "Homepage date calculator card must retain a clear utility label and CTA"
          print(f"Validated {len(articles)} articles, {len(urls)} sitemap URLs, and direct homepage plus technology-section calculator discovery.")
          PY
      - name: Test date calculator defaults and date arithmetic
        run: node --test scripts/date-calculator.test.mjs
      - name: Validate date calculator breadcrumb navigation
        run: python scripts/test_date_calculator_breadcrumbs.py
      - name: Validate Champions League Matchday 4 results update
        run: python scripts/validate_champions_league_results.py
      - name: Check new article metadata and references
        run: |
          python - <<'PY'
          import json, pathlib, re
          p = pathlib.Path("articles/champions-league-fixtures-week-barcelona-psg-real-madrid-leipzig-october-2026.html")
          html = p.read_text(encoding="utf-8")
          assert "<title>" in html and 'rel="canonical"' in html
          assert "Paris Saint-Germain beat Barcelona" in html
          assert "Real Madrid defeated RB Leipzig" in html
          assert "La Liga fixture, not a Champions League match" in html
          assert "uefa.com" in html and "fcbarcelona.com" in html and "realmadrid.com" in html
          scripts = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          assert len(scripts) == 1
          schema = json.loads(scripts[0])
          assert schema.get("@type") == "NewsArticle", "Past match recap must remain a NewsArticle"
          assert schema.get("dateModified") == "2026-11-09", "Article modification date is stale"
          about = schema.get("about", [])
          assert not any(isinstance(item, dict) and item.get("@type") == "SportsEvent" for item in about), "Past fixtures must not be marked up as upcoming event rich results"
          assert "Matchday 4 has since been completed" in html, "Stale upcoming Matchday 4 copy remains"
          assert "begins on November 3–4" not in html, "Past matchday is still described as upcoming"
          assert "Updated November 9, 2026" in html, "Visible article update date is stale"
          assert 'href="champions-league-matchday-4-preview-barcelona-aston-villa-real-madrid-aek-november-2026.html"' in html, "Missing internal link to the Matchday 4 results report"
          print("Article metadata, official references, NewsArticle schema, and current fixture status are valid.")
          PY
      - name: Validate football match-day nutrition guide
        run: python scripts/validate_football_nutrition_guide.py
